<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kheprx Swimming — Database Explorer</title>
<style>
  :root,[data-theme="dark"]{
    --reference:#64748b;--identity:#2563eb;--athlete:#0891b2;--health:#059669;--attendance:#7c3aed;--championships:#d97706;
    --bg:#0f172a;--panel:#0b1220;--card:#1e293b;--line:#334155;--text:#e2e8f0;--muted:#94a3b8;
    --codebg:#0b1220;--accent:#60a5fa;--active:#172033;--pk:#fbbf24;--fk:#60a5fa;--u:#34d399;
  }
  [data-theme="light"]{
    --reference:#475569;--identity:#1d4ed8;--athlete:#0e7490;--health:#047857;--attendance:#6d28d9;--championships:#b45309;
    --bg:#f8fafc;--panel:#ffffff;--card:#ffffff;--line:#cbd5e1;--text:#0f172a;--muted:#475569;
    --codebg:#f1f5f9;--accent:#1d4ed8;--active:#e2e8f0;--pk:#b45309;--fk:#1d4ed8;--u:#047857;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:Segoe UI,Tahoma,Arial,sans-serif;background:var(--bg);color:var(--text)}
  a{color:inherit}
  header{position:sticky;top:0;z-index:10;display:flex;gap:.6rem;align-items:center;
    padding:.6rem 1rem;background:var(--panel);border-bottom:1px solid var(--line)}
  header h1{font-size:1rem;margin:0;font-weight:600}
  .btn{padding:.35rem .7rem;border-radius:6px;border:1px solid var(--line);
    background:var(--card);color:var(--text);cursor:pointer;font-size:.8rem}
  .btn:hover{border-color:var(--accent)}
  .layout{display:grid;grid-template-columns:250px 1fr;min-height:calc(100vh - 50px)}
  .tree{border-inline-end:1px solid var(--line);background:var(--panel);position:sticky;top:50px;
    height:calc(100vh - 50px);overflow:auto;padding:.5rem}
  .treehead{position:sticky;top:0;background:var(--panel);padding:.1rem 0 .5rem}
  #filter{width:100%;padding:.4rem .6rem;border-radius:6px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:.82rem}
  .tgrp{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;margin:.7rem .4rem .2rem;font-weight:700}
  .tnode{display:block;padding:.25rem .5rem;border-radius:5px;text-decoration:none;font-size:.84rem;color:var(--text)}
  .tnode:hover{background:var(--card)}
  .tnode.active{background:var(--accent);color:#fff}
  .tglobal{font-weight:600}
  .pane{padding:1rem 1.4rem;overflow:auto}
  .breadcrumb{font-size:.8rem;color:var(--muted);margin-bottom:.8rem}
  .breadcrumb b{color:var(--text)}
  .thead{display:flex;gap:.5rem;align-items:baseline;flex-wrap:wrap;margin-bottom:.6rem}
  .ttitle{font-size:1.15rem;font-weight:600}
  .muted{color:var(--muted)}.small{font-size:.78rem}
  .subtabs{display:flex;gap:.3rem;border-bottom:1px solid var(--line);margin-bottom:.9rem;
    position:sticky;top:0;background:var(--bg);padding-top:.2rem;flex-wrap:wrap}
  .subtab{padding:.4rem .9rem;border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;
    text-decoration:none;font-size:.85rem;color:var(--muted)}
  .subtab:hover{color:var(--text)}
  .subtab.on{color:var(--text);background:var(--card);border-color:var(--line)}
  table.cols{width:100%;border-collapse:collapse;font-size:.84rem}
  table.cols th,table.cols td{text-align:start;padding:.35rem .8rem;border-top:1px solid var(--line);vertical-align:top}
  table.cols th{color:var(--muted);background:var(--active)}
  .badge{font-size:.65rem;padding:.05rem .35rem;border-radius:4px;border:1px solid currentColor;
    margin-inline-end:.25rem;white-space:nowrap}
  .pk{color:var(--pk)}.fk{color:var(--fk)}.u{color:var(--u)}.nn{color:var(--muted)}
  .ar{unicode-bidi:plaintext}
  .erd-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:1rem;
    margin-bottom:1rem;overflow:auto}
  .summary{display:flex;gap:.7rem;flex-wrap:wrap}
  .scard{display:block;background:var(--card);border:1px solid var(--line);border-inline-start-width:5px;
    border-radius:8px;padding:.6rem .9rem;min-width:130px;text-decoration:none}
  .scard:hover{border-color:var(--accent)}
  .scard-h{font-weight:700;text-transform:uppercase;font-size:.72rem;letter-spacing:.05em}
  .scard-n{font-size:.8rem;color:var(--muted);margin-top:.2rem}
  .codewrap{position:relative}
  .code{background:var(--codebg);border:1px solid var(--line);border-radius:8px;padding:.9rem 1rem;
    font-family:Consolas,Monaco,monospace;font-size:.8rem;white-space:pre;overflow:auto;margin:0}
  .copy{position:absolute;top:.5rem;right:.5rem;background:var(--card);border:1px solid var(--line);
    border-radius:5px;padding:.2rem .6rem;color:var(--text);cursor:pointer;font-size:.72rem}
  .copy:hover{border-color:var(--accent)}
  .relcols{display:flex;gap:1.2rem;flex-wrap:wrap}
  .relcols>div{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--line);
    border-radius:8px;padding:.7rem .9rem}
  .relcols h4{margin:.1rem 0 .5rem;font-size:.8rem;color:var(--accent)}
  .rellink{display:block;padding:.2rem 0;color:var(--fk);text-decoration:none}
  .rellink:hover{text-decoration:underline}
  .ixsec h4{margin:.8rem 0 .3rem;font-size:.82rem;color:var(--accent)}
  .ixsec ul{margin:.2rem 0;padding-inline-start:1.2rem;font-size:.84rem}
  .enumgrp{margin-bottom:1rem;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .enumtab{background:var(--active);padding:.4rem .8rem;font-weight:600}
  .enumtab a{text-decoration:none}
  .enumrow{display:flex;gap:.8rem;padding:.35rem .8rem;border-top:1px solid var(--line);flex-wrap:wrap}
  .enumcol{font-weight:600;min-width:160px}
  .enumval{display:inline-block;background:var(--active);border:1px solid var(--line);border-radius:10px;
    padding:.05rem .5rem;margin:.1rem;font-size:.78rem}
  .treetoggle{display:none}
  footer{padding:1rem 0 0;color:var(--muted);font-size:.74rem;border-top:1px solid var(--line);margin-top:1.5rem}
  @media (max-width:760px){
    .layout{grid-template-columns:1fr}
    .tree{position:static;height:auto;max-height:60vh;display:none}
    html[data-tree="open"] .tree{display:block}
    .treetoggle{display:inline-block}
  }
  @media print{
    header,.tree{display:none!important}
    .layout{grid-template-columns:1fr}
    .pane{overflow:visible}
    body{background:#fff;color:#000}
  }
</style>
</head>

 {from:"identity.swimmer_profile",to:"health.inbody_reading",card:"1-N",label:"records"},
 {from:"identity.swimmer_profile",to:"health.health_reading",card:"1-N",label:"records"},
 {from:"health.medical_test",to:"health.health_reading",card:"1-N",label:"measured by"},
 {from:"identity.swimmer_profile",to:"health.observation",card:"1-N",label:"noted on"},
 {from:"identity.swimmer_profile",to:"health.feedback_entry",card:"1-N",label:"receives"},
 {from:"identity.club",to:"attendance.attendance_session",card:"1-N",label:"holds"},
 {from:"reference.stroke",to:"attendance.attendance_session",card:"1-N",label:"grouped by"},
 {from:"attendance.attendance_session",to:"attendance.attendance_record",card:"1-N",label:"includes"},
 {from:"identity.swimmer_profile",to:"attendance.attendance_record",card:"1-N",label:"attends"},
 {from:"championships.competition_event",to:"championships.championship_enrollment",card:"1-N",label:"enrolls"},
 {from:"identity.swimmer_profile",to:"championships.championship_enrollment",card:"1-N",label:"enrolled in"},
 {from:"championships.competition_event",to:"championships.competition_day",card:"1-N",label:"spans"},
 {from:"championships.competition_day",to:"championships.race_session",card:"1-N",label:"schedules"},
 {from:"reference.stroke",to:"championships.race_session",card:"1-N",label:"of stroke"},
 {from:"reference.distance",to:"championships.race_session",card:"1-N",label:"of distance"},
 {from:"championships.race_session",to:"championships.race_assignment",card:"1-N",label:"assigns"},
 {from:"identity.swimmer_profile",to:"championships.race_assignment",card:"1-N",label:"swims in"},
 {from:"championships.race_session",to:"championships.race_result",card:"1-N",label:"produces"},
 {from:"identity.swimmer_profile",to:"championships.race_result",card:"1-N",label:"achieves"}
];
</script>
<script type="module">
"use strict";
// ====== HELPERS ======
const cssVar = (v) => v.startsWith("--") ? `var(${v})` : v;
const isArabic = (s) => /[؀-ۿ]/.test(s || "");
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function badges(col){
  const map = {PK:"pk",FK:"fk",U:"u"};
  const out = (col.k||"").split(",").filter(Boolean).map(k=>`<span class="badge ${map[k]||""}">${k}</span>`);
  if(col.n===false) out.push(`<span class="badge nn">NN</span>`);
  return out.join("");
}
function noteCell(col){
  let txt = col.note || "";
  if(col.d) txt = (txt?txt+" · ":"") + "default " + col.d;
  if(col.fk) txt = (txt?txt+" · ":"") + "→ " + col.fk;
  return `<span class="${isArabic(txt)?"ar":""}">${escapeHtml(txt)}</span>`;
}
function copyText(text){
  if(navigator.clipboard && window.isSecureContext){ return navigator.clipboard.writeText(text); }
  const ta=document.createElement("textarea"); ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try{ document.execCommand("copy"); } finally{ document.body.removeChild(ta); }
  return Promise.resolve();
}
const EID = (key) => key.replace(/\./g,"_");
const CARD = {"1-1":"||--||","1-N":"||--o{","01-N":"|o--o{","M-N":"}o--o{"};
function buildMermaid(){
  let out = "erDiagram\n";
  SCHEMA.forEach(s=>s.tables.forEach(t=>{
    const pk = t.cols.find(c=>(c.k||"").includes("PK"));
    out += `  ${EID(s.schema+"."+t.name)} {\n`;
    if(pk) out += `    ${pk.t.replace(/[^a-zA-Z0-9]/g,"")} ${pk.c.replace(/[^a-zA-Z0-9]/g,"")} PK\n`;
    out += `  }\n`;
  }));
  RELATIONSHIPS.forEach(r=>{
    const lbl = (r.label||"rel").replace(/[^a-zA-Z]/g,"") || "rel";
    out += `  ${EID(r.from)} ${CARD[r.card]||"||--o{"} ${EID(r.to)} : ${lbl}\n`;
  });
  return out;
}
// ====== DERIVATIONS ======
const tablesByKey = {};
SCHEMA.forEach(s => s.tables.forEach(t => {
  tablesByKey[`${s.schema}.${t.name}`] = {schema:s.schema, color:s.color, table:t};
}));
const TOTAL_TABLES = SCHEMA.reduce((n, s) => n + s.tables.length, 0);
const SCHEMA_COUNT = SCHEMA.length;
const incomingFks = {};
SCHEMA.forEach(s => s.tables.forEach(t => {
  const fromKey = `${s.schema}.${t.name}`;
  t.cols.forEach(c => {
    if(c.fk){
      const p = c.fk.split(".");
      const target = p[0] + "." + p[1];
      (incomingFks[target] = incomingFks[target] || []).push({from:fromKey, column:c.c});
    }
  });
}));
const enumColumns = [];
SCHEMA.forEach(s => s.tables.forEach(t => t.cols.forEach(c => {
  if(c.note && c.note.includes(" | ")){
    enumColumns.push({key:`${s.schema}.${t.name}`, schema:s.schema, color:s.color,
      table:t.name, column:c.c, values:c.note.split("|").map(v=>v.trim())});
  }
})));
// ====== DDL & INDEXES ======
function buildDDL(key){
  const entry = tablesByKey[key], schema = entry.schema, t = entry.table;
  const real = t.cols.filter(c=>c.t!=="—"), pseudo = t.cols.filter(c=>c.t==="—");
  const pkCols = real.filter(c=>(c.k||"").includes("PK")).map(c=>`"${c.c}"`);
  const colLines = real.map(c=>{
    let line = `  "${c.c}" ${c.t}`;
    if(c.d) line += ` DEFAULT ${c.d}`;
    if(c.n===false) line += ` NOT NULL`;
    return line;
  });
  const cons = [];
  if(pkCols.length) cons.push(`  PRIMARY KEY (${pkCols.join(", ")})`);
  real.forEach(c=>{ if((c.k||"").includes("U")) cons.push(`  UNIQUE ("${c.c}")`); });
  pseudo.forEach(c=>{ if((c.k||"").includes("U")){
    const cols = c.c.replace(/[()]/g,"").split(",").map(x=>`"${x.trim()}"`).join(", ");
    cons.push(`  UNIQUE (${cols})`);
  }});
  real.forEach(c=>{ if(c.note && c.note.includes(" | ")){
    const vals = c.note.split("|").map(v=>`'${v.trim()}'`).join(", ");
    cons.push(`  CONSTRAINT "${t.name}_${c.c}_chk" CHECK ("${c.c}" IN (${vals}))`);
  }});
  let ddl = `CREATE TABLE ${schema}."${t.name}" (\n${colLines.concat(cons).join(",\n")}\n);`;
  const fks = real.filter(c=>c.fk).map(c=>{
    const p = c.fk.split(".");
    return `ALTER TABLE ${schema}."${t.name}" ADD CONSTRAINT "${t.name}_${c.c}_fk" `
      + `FOREIGN KEY ("${c.c}") REFERENCES ${p[0]}."${p[1]}" ("${p[2]}");`;
  });
  if(fks.length) ddl += `\n\n-- FK constraints added via ALTER TABLE to avoid cross-schema ordering / cycles\n` + fks.join("\n");
  return ddl;
}
function ddlHtml(key){
  const ddl = buildDDL(key);
  return `<div class="codewrap"><button class="copy" data-copy="${encodeURIComponent(ddl)}">⧉ copy</button><pre class="code">${escapeHtml(ddl)}</pre></div>`;
}
// ====== VIEWS ======
let erdSvg = null;
async function renderOverview(view){
  view.innerHTML = `<div id="erdBox" class="erd-box">Rendering diagram…</div>
    <p class="muted small">Entity-relationship diagram · ${TOTAL_TABLES} tables across ${SCHEMA_COUNT} schemas. Pick a schema or table to drill in.</p>
    <div class="summary">${SCHEMA.map(s=>`
      <a class="scard" href="#/table/${s.schema}.${s.tables[0].name}" style="border-inline-start-color:${cssVar(s.color)}">
        <div class="scard-h" style="color:${cssVar(s.color)}">${s.schema}</div>
        <div class="scard-n">${s.tables.length} tables</div>
      </a>`).join("")}</div>`;
  const box = document.getElementById("erdBox");
  if(erdSvg){ box.innerHTML = erdSvg; return; }
  if(window.mermaid){
    try{
      window.mermaid.initialize({startOnLoad:false, theme:"default"});
      const {svg} = await window.mermaid.render("erdGraph", buildMermaid());
      erdSvg = svg;
      box.innerHTML = svg;
    }catch(err){ box.textContent = "Diagram render error: " + err.message; }
  } else {
    box.textContent = "Mermaid library not loaded.";
  }
}
const TABS = [["columns","Columns"],["ddl","DDL"],["relationships","Relationships"],["indexes","Indexes & Constraints"]];
function renderTable(view, key, tab){
  const entry = tablesByKey[key], t = entry.table;
  const inc = incomingFks[key] || [];
  const bar = TABS.map(([id,label])=>`<a class="subtab ${id===tab?'on':''}" href="#/table/${key}/${id}">${label}</a>`).join("");
  let body;
  if(tab==="ddl") body = ddlHtml(key);
  else if(tab==="relationships") body = relationshipsHtml(key);
  else if(tab==="indexes") body = indexesHtml(key);
  else body = columnsHtml(t);
  view.innerHTML = `<div class="thead">
      <span class="ttitle"><span style="color:${cssVar(entry.color)}">${entry.schema}.</span>${t.name}</span>
      ${t.note?`<span class="muted">— ${escapeHtml(t.note)}</span>`:""}
      <span class="muted small">· ${t.cols.filter(c=>c.t!=="—").length} columns · ${inc.length} incoming refs</span>
    </div>
    <div class="subtabs">${bar}</div>
    <div class="subbody">${body}</div>`;
}
function columnsHtml(t){
  const real = t.cols.filter(c=>c.t!=="—"), rules = t.cols.filter(c=>c.t==="—");
  let html = `<table class="cols"><thead><tr><th>Column</th><th>Type</th><th>Keys</th><th>Notes</th></tr></thead>
    <tbody>${real.map(c=>`<tr><td class="${isArabic(c.c)?'ar':''}">${escapeHtml(c.c)}</td>
      <td>${escapeHtml(c.t)}</td><td>${badges(c)}</td><td>${noteCell(c)}</td></tr>`).join("")}</tbody></table>`;
  if(rules.length) html += `<div class="ixsec"><h4>Rules</h4>${rules.map(c=>
    `<p class="small">${(c.k||"").includes("U")?"UNIQUE ":""}${escapeHtml(c.c)}${c.note?` <span class="muted">— ${escapeHtml(c.note)}</span>`:""}</p>`).join("")}</div>`;
  return html;
}
function relationshipsHtml(key){
  const t = tablesByKey[key].table;
  const outgoing = t.cols.filter(c=>c.fk).map(c=>{
    const p = c.fk.split("."); const target = p[0]+"."+p[1];
    return `<a class="rellink" href="#/table/${target}">${escapeHtml(c.c)} → ${target}</a>`;
  });
  const incoming = (incomingFks[key]||[]).map(r=>`<a class="rellink" href="#/table/${r.from}">${r.from}.${escapeHtml(r.column)}</a>`);
  return `<div class="relcols">
    <div><h4>Outgoing (this → other)</h4>${outgoing.join("")||'<span class="muted small">none</span>'}</div>
    <div><h4>Incoming (other → this)</h4>${incoming.join("")||'<span class="muted small">none</span>'}</div></div>`;
}
function buildIndexes(key){
  const entry = tablesByKey[key], schema = entry.schema, t = entry.table;
  const real = t.cols.filter(c=>c.t!=="—"), pseudo = t.cols.filter(c=>c.t==="—");
  const pk = real.filter(c=>(c.k||"").includes("PK")).map(c=>c.c);
  const uniques = [];
  real.forEach(c=>{ if((c.k||"").includes("U")) uniques.push([c.c]); });
  pseudo.forEach(c=>{ if((c.k||"").includes("U")) uniques.push(c.c.replace(/[()]/g,"").split(",").map(x=>x.trim())); });
  const fkIndexes = real.filter(c=>c.fk).map(c=>`CREATE INDEX "ix_${t.name}_${c.c}" ON ${schema}."${t.name}" ("${c.c}");`);
  return {pk, uniques, fkIndexes};
}
function indexesHtml(key){
  const ix = buildIndexes(key);
  const uniques = ix.uniques.length
    ? ix.uniques.map(u=>`<li>UNIQUE (${u.join(", ")})</li>`).join("")
    : '<li class="muted">none</li>';
  const fkix = ix.fkIndexes.length
    ? `<div class="codewrap"><button class="copy" data-copy="${encodeURIComponent(ix.fkIndexes.join("\n"))}">⧉ copy</button><pre class="code">${escapeHtml(ix.fkIndexes.join("\n"))}</pre></div>`
    : '<span class="muted small">no FK columns</span>';
  return `<div class="ixsec">
    <h4>Primary key</h4><p>${ix.pk.length?ix.pk.join(", "):'<span class="muted">none</span>'}</p>
    <h4>Unique constraints</h4><ul>${uniques}</ul>
    <h4>Suggested indexes (on FK columns)</h4>${fkix}</div>`;
}
function renderEnums(view){
  const byTable = {};
  enumColumns.forEach(e=>{ (byTable[e.key]=byTable[e.key]||[]).push(e); });
  const groups = Object.keys(byTable).map(key=>{
    const color = tablesByKey[key].color;
    const rows = byTable[key].map(e=>`<div class="enumrow"><span class="enumcol">${escapeHtml(e.column)}</span>
      <span>${e.values.map(v=>`<span class="enumval ${isArabic(v)?'ar':''}">${escapeHtml(v)}</span>`).join("")}</span></div>`).join("");
    return `<div class="enumgrp"><div class="enumtab"><a href="#/table/${key}/columns" style="color:${cssVar(color)}">${key}</a></div>${rows}</div>`;
  }).join("");
  view.innerHTML = `<div class="thead"><span class="ttitle">Enum Reference</span>
    <span class="muted small">· ${enumColumns.length} CHECK columns across the schema</span></div>${groups}`;
}
// ====== TREE ======
function renderTreeList(filter){
  filter = (filter||"").trim().toLowerCase();
  const globals = `<a class="tnode tglobal" data-key="overview" href="#/overview">▣ Overview</a>
    <a class="tnode tglobal" data-key="enums" href="#/enums">≡ Enum Reference</a>`;
  const groups = SCHEMA.map(s=>{
    const tables = s.tables.filter(t => !filter
      || t.name.toLowerCase().includes(filter)
      || t.cols.some(c=>c.c.toLowerCase().includes(filter)));
    if(!tables.length) return "";
    return `<div class="tgrp" style="color:${cssVar(s.color)}">${s.schema}</div>` +
      tables.map(t=>`<a class="tnode" data-key="${s.schema}.${t.name}" href="#/table/${s.schema}.${t.name}">${t.name}</a>`).join("");
  }).join("");
  const empty = (!groups && filter) ? `<p class="muted small" style="padding:.4rem">No matches.</p>` : "";
  document.getElementById("treelist").innerHTML = globals + groups + empty;
  setActiveTreeNode(parseHash());
}
function setActiveTreeNode(r){
  document.querySelectorAll(".tnode.active").forEach(n=>n.classList.remove("active"));
  const key = r.view==="table" ? r.key : r.view;
  const esc = (window.CSS && CSS.escape) ? CSS.escape(key) : key;
  const node = document.querySelector(`.tnode[data-key="${esc}"]`);
  if(node) node.classList.add("active");
}
// ====== ROUTER ======
function parseHash(){
  const h = (location.hash || "").replace(/^#\/?/,"");
  const parts = h.split("/").filter(Boolean);
  if(parts[0]==="table" && parts[1]) return {view:"table", key:decodeURIComponent(parts[1]), tab:parts[2]||"columns"};
  if(parts[0]==="enums") return {view:"enums"};
  return {view:"overview"};
}
function router(){
  const r = parseHash();
  const view = document.getElementById("view");
  const bc = document.getElementById("breadcrumb");
  if(r.view==="overview"){ bc.innerHTML = "<b>Overview</b>"; renderOverview(view); }
  else if(r.view==="enums"){ bc.innerHTML = "<b>Enum Reference</b>"; renderEnums(view); }
  else {
    const entry = tablesByKey[r.key];
    if(!entry){ bc.innerHTML = "Not found"; view.innerHTML = `<p class="muted">Unknown table: ${escapeHtml(r.key)}</p>`; }
    else { bc.innerHTML = `${entry.schema} / <b>${entry.table.name}</b>`; renderTable(view, r.key, r.tab); }
  }
  setActiveTreeNode(r);
}
// ====== INIT ======
function boot(){
  document.getElementById("footTables").textContent = TOTAL_TABLES;
  document.getElementById("footSchemas").textContent = SCHEMA_COUNT;
  renderTreeList("");
  router();
  window.addEventListener("hashchange", router);
  const filter = document.getElementById("filter");
  filter.addEventListener("input", e => renderTreeList(e.target.value));
  document.addEventListener("keydown", e => {
    if(e.key==="/" && document.activeElement !== filter){ e.preventDefault(); filter.focus(); }
  });
  document.getElementById("themeToggle").addEventListener("click", ()=>{
    const html=document.documentElement;
    const next = html.getAttribute("data-theme")==="light"?"dark":"light";
    html.setAttribute("data-theme", next);
    erdSvg = null;
    if(window.mermaid) window.mermaid.initialize({startOnLoad:false, theme: "default"});
    router();
  });
  document.getElementById("view").addEventListener("click", e=>{
    const b = e.target.closest(".copy"); if(!b) return;
    copyText(decodeURIComponent(b.dataset.copy)).then(()=>{
      const o=b.textContent; b.textContent="copied ✓"; setTimeout(()=>b.textContent=o,1200);
    });
  });
  if(window.mermaid) window.mermaid.initialize({startOnLoad:false,
    theme: "default"});
  const treeToggle = document.getElementById("treeToggle");
  treeToggle.addEventListener("click", ()=>{
    const html=document.documentElement;
    html.setAttribute("data-tree", html.getAttribute("data-tree")==="open"?"closed":"open");
  });
  document.getElementById("treelist").addEventListener("click", e=>{
    if(e.target.closest(".tnode") && window.matchMedia("(max-width:760px)").matches){
      document.documentElement.setAttribute("data-tree","closed");
    }
  });
}
boot();
</script>
