<div class="relative min-h-full w-full" dir="rtl">
  <app-decor-background />
  <div class="relative z-10 mx-auto max-w-6xl px-4 py-8 sm:px-6 sm:py-10">
    <!-- Greeting header -->
    <header class="mb-10">
      <p class="text-sm font-medium text-text-secondary">مرحباً بعودتك</p>
      <h1 class="gradient-text mt-1 text-3xl font-extrabold sm:text-4xl">{{ currentUserName() }}</h1>
      <p class="mt-2 text-text-secondary">اختر القسم الذي تريد العمل عليه</p>
    </header>
    <!-- Dashboard cards -->
    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
      @for (card of cards(); track card.label; let i = $index) {
        @if (card.route) {
          <!-- Active card — navigates on click -->
          <button
            (click)="go(card.route)"
            [style.animation-delay.ms]="i * 50"
            class="card-hover card-glow group animate-fade-in relative overflow-hidden rounded-2xl border border-border bg-surface p-6 text-right shadow-sm transition-all hover:-translate-y-1">
            <div
              class="pointer-events-none absolute -left-8 -top-8 h-24 w-24 rounded-full bg-gradient-to-br opacity-10 transition-opacity group-hover:opacity-20"
              [class]="card.color">
            </div>
            <div
              class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br text-white shadow-md"
              [class]="card.color">
              <svg [lucideIcon]="card.icon" [size]="26"></svg>
            </div>
            <h2 class="text-lg font-bold text-ink">{{ card.label }}</h2>
            <p class="mt-1 text-sm text-text-secondary">{{ card.desc }}</p>
          </button>
        } @else {
          <!-- Disabled card — "قريباً" placeholder, feature not built yet -->
          <button
            disabled
            title="قريباً"
            [style.animation-delay.ms]="i * 50"
            class="card-hover group animate-fade-in relative overflow-hidden rounded-2xl border border-border bg-surface p-6 text-right shadow-sm cursor-not-allowed opacity-60">
            <div
              class="pointer-events-none absolute -left-8 -top-8 h-24 w-24 rounded-full bg-gradient-to-br opacity-10"
              [class]="card.color">
            </div>
            <div
              class="mb-4 flex h-14 w-14 items-center justify-center rounded-2xl bg-gradient-to-br text-white shadow-md"
              [class]="card.color">
              <svg [lucideIcon]="card.icon" [size]="26"></svg>
            </div>
            <h2 class="text-lg font-bold text-ink">{{ card.label }}</h2>
            <p class="mt-1 text-sm text-text-secondary">{{ card.desc }}</p>
          </button>
        }
      }
    </div>
  </div>
</div>
